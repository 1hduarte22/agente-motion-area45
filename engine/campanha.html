<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Area45 Campanha</title>
<style>
  /* Area45 · template gráfico de campanha (sem fotos): tipografia cinética + mockups em CSS.
     O mesmo spec gera vídeo (render.mjs) e peças estáticas (render.mjs --stills). */
  :root{
    --W:1080px; --H:1920px; --pad:76px; --top:250px; --bottom:360px;
    --bg:#0A0A0B; --bg2:#141416; --ink:#F5F3EE; --muted:rgba(245,243,238,.66); --line:rgba(245,243,238,.14);
    --accent:#C8FF2E; --accent-ink:#0A0A0B; --cta:#25D366;
    --font:'Inter Display','Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
  #stage{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--bg)}
  .scene{position:absolute;inset:0;opacity:0;overflow:hidden;background:var(--bg)}
  .glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%);left:50%;top:50%;margin:-700px 0 0 -700px;opacity:.55}
  .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;opacity:.35;mask-image:radial-gradient(90% 70% at 50% 45%,#000 30%,transparent 80%)}
  .grain{position:absolute;inset:0;z-index:60;pointer-events:none;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .safe{position:absolute;left:var(--pad);right:var(--pad);top:var(--top);bottom:var(--bottom);display:flex;flex-direction:column;justify-content:center;gap:34px}
  .center{align-items:center;text-align:center}
  .anim{opacity:0;will-change:transform,opacity}

  /* cabeçalho fixo: logo + selo */
  .head{position:absolute;left:var(--pad);right:var(--pad);top:var(--head-top,150px);display:flex;justify-content:space-between;align-items:center;z-index:50}
  .logo{display:flex;align-items:center;gap:16px;font-weight:900;font-size:40px;letter-spacing:.02em}
  .logo .mk{width:30px;height:30px;background:var(--accent);transform:rotate(45deg);border-radius:4px}
  .logo b{color:var(--accent);font-weight:900}
  .logo small{display:block;font-size:15px;font-weight:700;letter-spacing:.42em;color:var(--muted);margin-top:2px}
  .logo img{height:64px}
  .seal{font-weight:800;font-size:24px;letter-spacing:.18em;text-transform:uppercase;border:2px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:999px}

  /* fita corrida */
  .ticker{position:absolute;left:-40px;right:-40px;height:84px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;overflow:hidden;transform:rotate(-3deg);z-index:5;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .ticker .run{white-space:nowrap;font-weight:900;font-size:40px;letter-spacing:.06em;text-transform:uppercase}
  .ticker .run i{font-style:normal;display:inline-block;margin:0 26px;transform:translateY(-3px)}

  /* tipografia */
  .kicker{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:32px;letter-spacing:.1em;text-transform:uppercase;padding:14px 26px;border-radius:10px}
  .center .kicker{align-self:center}
  .big{font-weight:900;font-size:var(--big,150px);line-height:.86;letter-spacing:-.045em;text-transform:uppercase}
  .big .ol{color:transparent;-webkit-text-stroke:3px var(--ink)}
  .big em,.h1 em,.h2 em{font-style:normal;color:var(--accent)}
  .h1{font-weight:900;font-size:var(--h1,104px);line-height:.96;letter-spacing:-.035em}
  .h2{font-weight:850;font-size:var(--h2,72px);line-height:1.02;letter-spacing:-.025em}
  .sub{font-weight:500;font-size:var(--sub,42px);line-height:1.25;color:var(--muted)}
  .sub b{color:var(--ink);font-weight:800}
  .hl{background:var(--accent);color:var(--accent-ink);padding:0 .14em;border-radius:.08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .strike{position:relative;display:inline-block;color:var(--muted)}
  .strike::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.09em;background:var(--accent);transform:scaleX(var(--s,1));transform-origin:left}

  /* lista de entregáveis */
  .list{display:flex;flex-direction:column;gap:var(--lgap,18px)}
  .item{display:flex;align-items:center;gap:26px;background:var(--bg2);border:2px solid var(--line);border-radius:22px;padding:var(--ipad,20px 26px)}
  .item .ic{flex:none;width:var(--ic,72px);height:var(--ic,72px);border-radius:16px;background:var(--accent);display:grid;place-items:center}
  .item .ic svg{width:58%;height:58%;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .item .tx{font-weight:800;font-size:var(--it,44px);line-height:1.05;letter-spacing:-.01em}
  .item .tx small{display:block;font-weight:500;font-size:.62em;color:var(--muted);margin-top:4px;letter-spacing:0}
  .item .ok{margin-left:auto;flex:none;font-weight:900;font-size:40px;color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:12px}
  .center .chips{justify-content:center}
  .chip{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:var(--chip,30px);padding:12px 20px;border-radius:999px;border:2px solid var(--line);background:var(--bg2)}
  .chip::before{content:"";width:12px;height:12px;background:var(--accent);transform:rotate(45deg);border-radius:2px}

  /* preço */
  .price-block{display:flex;flex-direction:column;gap:10px}
  .center .price-block{align-items:center}
  .price-pre{font-weight:800;font-size:var(--pp,38px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .price{display:flex;align-items:flex-start;font-weight:900;font-size:var(--price,300px);line-height:.82;letter-spacing:-.06em;color:var(--accent)}
  .price .cur{font-size:.26em;letter-spacing:-.01em;margin:.22em .12em 0 0;color:var(--ink)}
  .price .cents{font-size:.26em;letter-spacing:-.01em;margin:.12em 0 0 .06em}
  .price-post{font-weight:600;font-size:var(--pq,36px);color:var(--ink)}
  .badge{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:30px;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--accent);color:var(--accent);padding:12px 22px;border-radius:999px}
  .center .badge{align-self:center}
  .badge .dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}

  /* CTA */
  .btn{align-self:flex-start;display:inline-flex;align-items:center;gap:20px;background:var(--cta);color:#fff;font-weight:850;font-size:var(--btn,48px);padding:30px 50px;border-radius:999px;box-shadow:0 20px 60px color-mix(in srgb,var(--cta) 40%,transparent)}
  .btn.alt{background:var(--accent);color:var(--accent-ink);box-shadow:0 20px 60px color-mix(in srgb,var(--accent) 35%,transparent)}
  .center .btn{align-self:center}
  .btn svg{width:1.15em;height:1.15em}
  .handle{font-weight:700;font-size:34px;letter-spacing:.02em}
  .fine{font-weight:500;font-size:24px;color:var(--muted);line-height:1.35}
  .arrow{font-size:76px;color:var(--accent);line-height:1}

  /* kit (mockups em CSS) — caixa 900×760, escalada por --kit */
  .kitwrap{position:relative;align-self:center;width:calc(900px*var(--kit,1));height:calc(760px*var(--kit,1))}
  .kit{position:absolute;left:0;top:0;width:900px;height:760px;transform:scale(var(--kit,1));transform-origin:0 0}
  .kit>*{position:absolute}
  .mk-book{left:40px;top:40px;width:400px;height:520px;background:#F5F3EE;color:#111;border-radius:14px;box-shadow:0 40px 80px rgba(0,0,0,.55);padding:38px;display:flex;flex-direction:column;gap:16px;--r:-7deg}
  .mk-book .t{font-weight:900;font-size:40px;line-height:.95;letter-spacing:-.03em}
  .mk-book .s{font-weight:600;font-size:17px;letter-spacing:.3em;color:#666}
  .mk-book .sym{margin:auto 0 0;display:flex;align-items:center;gap:14px;font-weight:900;font-size:34px}
  .mk-book .bars{display:flex;height:22px;border-radius:6px;overflow:hidden}
  .mk-book .bars i{flex:1}
  .sym .m{width:44px;height:44px;border-radius:50%;background:#111;position:relative}
  .sym .m::after{content:"";position:absolute;right:-8px;bottom:-8px;width:24px;height:24px;background:var(--accent);border-radius:4px}
  .mk-card{width:420px;height:240px;border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.6);padding:30px;display:flex;flex-direction:column;justify-content:space-between}
  .mk-card.front{left:430px;top:70px;background:#121214;border:1px solid #2a2a2e;--r:6deg}
  .mk-card.back{left:480px;top:290px;background:var(--accent);color:var(--accent-ink);--r:-4deg}
  .mk-card .nm{font-weight:900;font-size:26px}
  .mk-card .ln{font-weight:500;font-size:16px;opacity:.75;line-height:1.5}
  .mk-type{left:520px;top:555px;width:230px;height:220px;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;--r:3deg}
  .mk-type .aa{font-weight:900;font-size:110px;line-height:.8;letter-spacing:-.05em}
  .mk-type .lb{font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
  .mk-pal{left:60px;top:600px;display:flex;gap:14px;--r:0deg}
  .mk-pal i{width:76px;height:76px;border-radius:50%;box-shadow:0 14px 30px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.12)}
  .mk-hl{left:770px;top:555px;display:flex;flex-direction:column;gap:12px;--r:0deg}
  .mk-hl .c{width:100px;height:100px;border-radius:50%;padding:5px;background:conic-gradient(var(--accent),#7CFFB2,var(--accent))}
  .mk-hl .c div{width:100%;height:100%;border-radius:50%;background:#121214;border:4px solid var(--bg);display:grid;place-items:center}
  .mk-hl svg{width:42px;height:42px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .wipe{position:absolute;top:-10%;bottom:-10%;width:140%;left:-20%;background:var(--accent);z-index:70;transform:translateX(-120%) skewX(-12deg)}
  .note{position:absolute;right:var(--pad);bottom:calc(var(--bottom) - 60px);font-size:20px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* Runtime: window.SPEC → cenas; window.seek(t) desenha o quadro t (s). Determinístico: sem timers nem transições CSS. */
const SPEC = window.SPEC || __SPEC__;
const R = document.documentElement.style;
const W=SPEC.width, H=SPEC.height, tall=H/W>1.5;
R.setProperty('--W',W+'px'); R.setProperty('--H',H+'px');
// zonas seguras: Reels/Stories escondem ~250 px no topo e ~360 px embaixo; feed 4:5 quase nada
const safe = SPEC.safe || (tall? {top:290,bottom:380,head:150} : {top:170,bottom:90,head:64});
R.setProperty('--top',safe.top+'px'); R.setProperty('--bottom',safe.bottom+'px'); R.setProperty('--head-top',safe.head+'px');
for (const [k,v] of Object.entries(SPEC.palette||{})) R.setProperty('--'+k,v);
for (const [k,v] of Object.entries((tall?SPEC.vars?.tall:SPEC.vars?.short)||{})) R.setProperty('--'+k,v);

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease={out:p=>1-Math.pow(1-p,3),out5:p=>1-Math.pow(1-p,5),inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  back:p=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)}};
const stage=document.getElementById('stage');
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const anim=(n,d,k='up')=>{n.classList.add('anim');n.dataset.d=d;n.dataset.k=k;return n};
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const ICONS={
  logo:svg('<path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/>'),
  manual:svg('<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-4a2 2 0 0 0-2 2"/><path d="M14 18V7M20 4v14h-6"/>'),
  paleta:svg('<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.6-1.8 0-1.3-1-1.6-1-2.7 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4C21 6.3 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/>'),
  tipografia:svg('<path d="M4 7V4h16v3M9 20h6M12 4v16"/>'),
  destaques:svg('<circle cx="6" cy="12" r="3.2"/><circle cx="18" cy="12" r="3.2"/><circle cx="12" cy="6" r="3.2"/><circle cx="12" cy="18" r="3.2"/>'),
  aplicacao:svg('<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/>'),
  cartao:svg('<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M6 10h6M6 14h9"/>'),
  heart:svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
  star:svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>')
};
const WA='<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.4.7 4.7 1.9 6.7L3 29l6.9-2.2c1.9 1 4 1.6 6.1 1.6 7 0 12.7-5.7 12.7-12.7S23 3 16 3zm0 23.2c-1.9 0-3.8-.5-5.4-1.5l-.4-.2-4.1 1.3 1.3-4-.3-.4c-1.1-1.7-1.7-3.7-1.7-5.7C5.4 9.9 10.2 5.2 16 5.2s10.6 4.7 10.6 10.5S21.8 26.2 16 26.2zm5.8-7.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.6-.9-.8-1.6-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.4 1.4.6 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>';

const ITEMS = SPEC.items || [];
function itemList(sc,s,d0,step){
  const l=el('div','list');
  ITEMS.forEach((it,i)=>{const r=el('div','item',`<div class="ic">${ICONS[it.icon]||ICONS.star}</div><div class="tx">${it.label}${it.note?`<small>${it.note}</small>`:''}</div><div class="ok">✓</div>`);
    l.appendChild(anim(r,d0+i*step,'left'));});
  return l;
}
function chips(d0,step){const c=el('div','chips');ITEMS.forEach((it,i)=>c.appendChild(anim(el('div','chip',it.short||it.label),d0+i*step,'pop')));return c}
function priceBlock(sc,s,d){
  const b=el('div','price-block');
  if(s.pre) b.appendChild(anim(el('div','price-pre',s.pre),d));
  if(s.from) b.appendChild(anim(el('div','price-post',`<span class="strike">${s.from}</span>`),d+.1));
  const p=anim(el('div','price',`<span class="cur">R$</span><span class="num">0</span><span class="cents">,${SPEC.price.cents||'00'}</span>`),d+.15,'pop');
  b.appendChild(p); sc._num=p.querySelector('.num'); sc._numD=d+.15;
  if(s.post) b.appendChild(anim(el('div','price-post',s.post),d+.9));
  return b;
}
function kit(d0){
  const pal=SPEC.kitPalette||['#111111','#F5F3EE','var(--accent)','#7CFFB2','#3D3D44'];
  const wrap=el('div','kitwrap'), k=el('div','kit'); wrap.appendChild(k);
  const bars=pal.map(c=>`<i style="background:${c}"></i>`).join('');
  const parts=[
    el('div','mk-book',`<div class="s">MANUAL DE MARCA</div><div class="t">Identidade<br>Visual</div><div class="bars">${bars}</div><div class="sym"><span class="m"></span>sua marca</div>`),
    el('div','mk-card front',`<div class="sym" style="display:flex;align-items:center;gap:14px;font-weight:900;font-size:28px"><span class="m" style="background:#F5F3EE"></span>sua marca</div><div><div class="nm">Seu Nome</div><div class="ln">(00) 00000-0000 · @suamarca</div></div>`),
    el('div','mk-card back',`<div class="ln" style="opacity:.8">cartão de visita · arte digital</div><div class="nm" style="font-size:40px">sua marca</div>`),
    el('div','mk-type','<div class="aa">Aa</div><div class="lb">Tipografia</div>'),
    el('div','mk-pal',pal.map(c=>`<i style="background:${c}"></i>`).join('')),
    el('div','mk-hl',`<div class="c"><div>${ICONS.star}</div></div><div class="c"><div>${ICONS.heart}</div></div>`)
  ];
  parts.forEach((p,i)=>k.appendChild(anim(p,d0+i*.16,'fly')));
  return wrap;
}

const B={
  // gancho: linhas batendo na tela uma a uma
  hook(sc,s){const w=el('div','safe '+(s.align||''));
    if(s.kicker) w.appendChild(anim(el('div','kicker',s.kicker),.05,'pop'));
    s.lines.forEach((ln,i)=>w.appendChild(anim(el('div',s.size||'h1',ln),.15+i*(s.step??.32),'slam')));
    if(s.sub) w.appendChild(anim(el('div','sub',s.sub),.25+s.lines.length*(s.step??.32)));
    sc.appendChild(w);},
  // título gigante BLACK / NOVEMBER + fita corrida
  title(sc,s){const w=el('div','safe '+(s.align||''));
    if(s.kicker) w.appendChild(anim(el('div','kicker',s.kicker),.05,'pop'));
    s.lines.forEach((ln,i)=>w.appendChild(anim(el('div','big',ln),.12+i*.2,'rise')));
    if(s.sub) w.appendChild(anim(el('div','sub',s.sub),.7));
    sc.appendChild(w);
    if(s.ticker){const t=el('div','ticker');t.style.top=s.tickerTop||(tall?'1330px':'1150px');
      const r=el('div','run',Array(14).fill(`${s.ticker}<i>◆</i>`).join(''));t.appendChild(r);sc._run=r;sc.appendChild(t);}},
  // composição do kit em mockups
  kit(sc,s){const w=el('div','safe center');
    if(s.kicker) w.appendChild(anim(el('div','kicker',s.kicker),.05,'pop'));
    if(s.title) w.appendChild(anim(el('div','h2',s.title),.15));
    w.appendChild(kit(.35));
    if(s.sub) w.appendChild(anim(el('div','sub',s.sub),1.4));
    sc.appendChild(w);},
  // lista do que está incluso
  list(sc,s){const w=el('div','safe');
    if(s.kicker) w.appendChild(anim(el('div','kicker',s.kicker),.05,'pop'));
    if(s.title) w.appendChild(anim(el('div','h2',s.title),.12));
    w.appendChild(itemList(sc,s,.35,s.step??.45));
    if(s.sub) w.appendChild(anim(el('div','sub',s.sub),.5+ITEMS.length*(s.step??.45)));
    sc.appendChild(w);},
  // preço com contagem
  price(sc,s){const w=el('div','safe '+(s.align||''));
    if(s.badge) w.appendChild(anim(el('div','badge',`<span class="dot"></span>${s.badge}`),.05,'pop'));
    w.appendChild(priceBlock(sc,s,.2));
    if(s.chips) w.appendChild(chips(1.2,.1));
    if(s.sub) w.appendChild(anim(el('div','sub',s.sub),1.3));
    sc.appendChild(w);},
  // oferta completa numa tela (peças estáticas e fechamento)
  offer(sc,s){const w=el('div','safe '+(s.align||''));
    if(s.kicker) w.appendChild(anim(el('div','kicker',s.kicker),.05,'pop'));
    if(s.lines) s.lines.forEach((ln,i)=>w.appendChild(anim(el('div',s.size||'big',ln),.12+i*.15,'rise')));
    if(s.title) w.appendChild(anim(el('div','h2',s.title),.4));
    if(s.list) w.appendChild(itemList(sc,s,.5,.12)); else if(s.chips!==false) w.appendChild(chips(.5,.08));
    w.appendChild(priceBlock(sc,s,.8));
    if(s.button){const b=anim(el('div','btn'+(s.buttonAlt?' alt':''),(s.buttonAlt?'':WA)+`<span>${s.button}</span>`),1.5,'pop');w.appendChild(b);}
    if(s.fine) w.appendChild(anim(el('div','fine',s.fine),1.6));
    sc.appendChild(w);},
  // chamada para ação
  cta(sc,s){const w=el('div','safe '+(s.align||'center'));
    if(s.badge) w.appendChild(anim(el('div','badge',`<span class="dot"></span>${s.badge}`),.05,'pop'));
    w.appendChild(anim(el('div','h1',s.title),.12,'slam'));
    if(s.sub) w.appendChild(anim(el('div','sub',s.sub),.4));
    const b=anim(el('div','btn'+(s.buttonAlt?' alt':''),(s.buttonAlt?'':WA)+`<span>${s.button||'Chamar no WhatsApp'}</span>`),.7,'pop');w.appendChild(b);sc._btn=b;
    if(SPEC.handle) w.appendChild(anim(el('div','handle',SPEC.handle),.95));
    if(s.fine) w.appendChild(anim(el('div','fine',s.fine),1.05));
    if(s.arrow) {const a=anim(el('div','arrow','↓'),1.15);w.appendChild(a);sc._arrow=a;}
    sc.appendChild(w);}
};

let t0=0; const scenes=[];
SPEC.scenes.forEach((s,i)=>{
  const sc=el('div','scene'); sc.style.zIndex=i+1;
  sc.appendChild(el('div','grid')); const g=el('div','glow'); sc.appendChild(g); sc._glow=g;
  if(s.vars) for(const [k,v] of Object.entries((tall?s.vars.tall:s.vars.short)||s.vars)) if(typeof v!=='object') sc.style.setProperty('--'+k,v);
  B[s.type](sc,s); stage.appendChild(sc);
  scenes.push({el:sc,s,start:t0,dur:s.dur,i}); t0+=s.dur;
});
const TOTAL=t0;
const head=el('div','head',`${SPEC.logo?`<img src="${SPEC.logo}">`:`<div class="logo"><span class="mk"></span><div>AREA<b>45</b><small>MARKETING</small></div></div>`}${SPEC.seal?`<div class="seal">${SPEC.seal}</div>`:''}`);
stage.appendChild(head);
stage.appendChild(el('div','grain'));
const wipe=el('div','wipe'); stage.appendChild(wipe);

window.DURATION=TOTAL;
window.SCENES=scenes.map(x=>({start:x.start,dur:x.dur}));
const WD=.42; // duração do wipe entre cenas
window.seek=function(t){
  // wipe: cobre a troca de cena (centro do wipe = corte)
  let wx=-120;
  for(const sc of scenes) if(sc.i>0 && Math.abs(t-sc.start)<WD/2){wx=-120+240*ease.inOut((t-sc.start+WD/2)/WD);}
  wipe.style.transform=`translateX(${wx}%) skewX(-12deg)`;
  for(const sc of scenes){
    const lt=t-sc.start,e=sc.el;
    if(lt<0||lt>=sc.dur&&sc.i<scenes.length-1){e.style.opacity=0;continue;}
    e.style.opacity=1;
    const p=lt/sc.dur;
    e.style.transform=`scale(${1.035-0.035*ease.out(clamp(lt/.6))})`;
    e._glow.style.transform=`translate(${Math.sin(t*.6+sc.i)*120}px,${Math.cos(t*.45+sc.i)*160-120}px)`;
    e.querySelectorAll('.anim').forEach(n=>{
      const d=+n.dataset.d,k=n.dataset.k,q=clamp((lt-d)/(k==='slam'?.32:.55));
      n.style.opacity=k==='slam'?clamp(q*3):ease.out(q);
      if(k==='pop') n.style.transform=`scale(${.7+.3*ease.back(q)})`;
      else if(k==='slam') n.style.transform=`scale(${1.35-.35*ease.out5(q)})`;
      else if(k==='left') n.style.transform=`translateX(${(1-ease.out(q))*-90}px)`;
      else if(k==='rise'){n.style.clipPath=`inset(${(1-ease.out(q))*100}% 0 -20% 0)`;n.style.opacity=1;n.style.transform=`translateY(${(1-ease.out(q))*80}px)`;}
      else if(k==='fly'){const r=getComputedStyle(n).getPropertyValue('--r')||'0deg';n.style.transform=`translateY(${(1-ease.out(q))*160}px) rotate(${r}) scale(${.85+.15*ease.back(q)})`;}
      else n.style.transform=`translateY(${(1-ease.out(q))*60}px)`;
    });
    e.querySelectorAll('.strike').forEach(n=>n.style.setProperty('--s',ease.out(clamp((lt-.6)/.4))));
    if(e._num){const q=ease.out(clamp((lt-e._numD)/1.1));e._num.textContent=Math.round(SPEC.price.value*q);}
    if(e._run) e._run.style.transform=`translateX(${-(t*140)%600}px)`;
    if(e._btn&&lt>1.3){const q=((lt-1.3)%1.2)/1.2;e._btn.style.transform=`scale(${1+.05*Math.sin(q*Math.PI)})`;}
    if(e._arrow&&lt>1.6) e._arrow.style.transform=`translateY(${Math.abs(Math.sin((lt-1.6)*Math.PI*1.4))*22}px)`;
  }
};
window.seek(0);
</script>
</body>
</html>
